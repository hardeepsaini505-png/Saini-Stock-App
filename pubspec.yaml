name: saini_stock_app
description: Saini Stock App - Inventory, Stock Management, Billing and Payment Management App.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon.png"
  min_sdk_android: 21
